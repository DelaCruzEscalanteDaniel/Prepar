<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del ciclo · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<h1>Control del ciclo</h1>
<div class="fila">
<div class="caja">
<h2>Ciclo</h2>
<label>Ciclo<select id="ciclo"></select></label>
<button class="btn2" id="activar">Activar</button> <button class="btn2" id="nuevo">Nuevo ciclo</button>
<p class="mensaje" id="mensaje" style="margin-top:12px"></p>
<div id="estado"></div>
<form method="post" id="form" class="oculto" style="margin-top:18px">
<h2>Nuevo ciclo</h2>
<label>Nombre<input name="nombre" maxlength="50" required></label>
<div class="fila"><label>Año<input name="anio" type="number" min="2000" max="2100" required></label>
<label>Presupuesto total<input name="presupuesto" type="number" min="1" step="0.01" required></label></div>
<p class="tenue">Participan todas las colonias. El presupuesto se reparte solo: la mitad en partes iguales y la otra mitad según pobreza, delincuencia y población.</p>
<p class="mensaje"></p>
<button class="btn">Crear ciclo</button>
</form>
</div>
<div class="caja"><h2>Votos por colonia</h2><div class="grafica" id="grafica"></div><p class="tenue" id="totales"></p></div>
</div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/admin-inicio.js"></script>
</body>
</html>
