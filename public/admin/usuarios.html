<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<div class="titulo"><div><h1>Usuarios</h1><p>Las cuentas de Prepar, separadas por tipo.</p></div>
<label>Buscar<input id="buscar" type="search" placeholder="Nombre o correo"></label></div>
<div class="pestanas" id="pestanas">
<button data-rol="ciudadano" class="activo">Ciudadanos <span id="n-ciudadano"></span></button>
<button data-rol="funcionario">Funcionarios <span id="n-funcionario"></span></button>
<button data-rol="administrador">Administradores <span id="n-administrador"></span></button>
</div>
<form method="post" class="caja oculto" id="form">
<h2>Registrar funcionario</h2>
<div class="fila" style="align-items:flex-end">
<label>Nombre completo<input name="nombre" maxlength="60" required></label>
<label>Correo<input name="correo" type="email" maxlength="60" required></label>
<label>Alcaldía<select name="alcaldia_id" id="alcaldia" required></select></label>
<div style="flex:.5;margin-bottom:14px"><button class="btn" style="width:100%">Registrar</button></div>
</div>
<p class="mensaje"></p>
</form>
<div class="caja tabla"><table><thead><tr><th>Nombre</th><th>Correo</th><th id="col-lugar">Colonia</th><th>Estado</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
</main>
<footer><div><span>Prepar · Simulador educativo del Presupuesto Participativo de la CDMX · Equipo 04</span><a href="/privacidad.html">Aviso de privacidad</a></div></footer>
<script src="/js/app.js"></script>
<script src="/js/pages/admin-usuarios.js"></script>
</body>
</html>
