<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<div class="titulo">
<div><h1>Usuarios</h1></div>
<label>Tipo de cuenta<select id="filtro-rol"><option value="">Todas</option><option value="ciudadano">Ciudadanos</option><option value="funcionario">Funcionarios</option><option value="administrador">Administradores</option></select></label>
</div>
<form method="post" class="caja" id="form">
<h2>Registrar funcionario</h2>
<div class="fila">
<label>Nombre completo<input name="nombre" maxlength="60" required></label>
<label>Correo<input name="correo" type="email" maxlength="60" required></label>
<label>Alcaldía<select name="alcaldia_id" id="alcaldia" required></select></label>
</div>
<p class="mensaje"></p>
<button class="btn">Registrar</button>
</form>
<div class="caja tabla"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Lugar</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/admin-usuarios.js"></script>
</body>
</html>
