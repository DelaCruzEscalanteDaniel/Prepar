<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepar: simulador educativo del Presupuesto Participativo de la Ciudad de México.">
<meta name="theme-color" content="#F3F6FA">
<title>Estadísticas · Prepar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=castor2">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=castor2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=castor2">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-rol="administrador" data-pagina="estadisticas">
<main id="principal" tabindex="-1">
<div><h1 class="titulo-pagina" style="margin:0 0 4px;font-size:32px">Estadísticas</h1>
  <p class="texto-2" style="margin:0"><strong class="acento-texto">1.</strong> Elige qué quieres analizar · <strong class="acento-texto">2.</strong> Ajusta los filtros · <strong class="acento-texto">3.</strong> Presiona «Generar gráficas»</p></div>
<div class="tabs-estad" role="tablist">
  <button type="button" role="tab" class="tab-maq tab-estad" aria-selected="true" data-tipo="participacion"><span>Participación</span><small>Registrados y votantes</small></button>
  <button type="button" role="tab" class="tab-maq tab-estad" aria-selected="false" data-tipo="demograficas"><span>Demografía</span><small>Género y edad</small></button>
  <button type="button" role="tab" class="tab-maq tab-estad" aria-selected="false" data-tipo="proyectos"><span>Proyectos</span><small>Del foro al ganador y votos</small></button>
  <button type="button" role="tab" class="tab-maq tab-estad" aria-selected="false" data-tipo="seguimiento"><span>Seguimiento de obras</span><small>Avance y gasto</small></button>
</div>
<form id="filtros" class="tarjeta filtros-estad" novalidate>
  <label data-f="ciclo">Ciclo<select name="ciclo" id="f-ciclo"></select></label>
  <label data-f="alcaldia">Alcaldía<select name="alcaldia" id="f-alcaldia"></select></label>
  <label data-f="unidad">Colonia (unidad territorial)<select name="unidad" id="f-unidad"></select></label>
  <label data-f="genero">Género<select name="genero"><option value="">Todos</option><option value="mujer">Mujer</option><option value="hombre">Hombre</option><option value="no_binario">No binario</option><option value="prefiero_no_decir">Prefiero no decir</option></select></label>
  <label data-f="rango">Rango de edad<select name="rango"><option value="">Todos</option><option value="18-29">18 a 29</option><option value="30-44">30 a 44</option><option value="45-59">45 a 59</option><option value="60+">60 o más</option></select></label>
  <label data-f="rubro">Rubro<select name="rubro" id="f-rubro"></select></label>
  <label data-f="desde">Desde<input type="date" name="desde"></label>
  <label data-f="hasta">Hasta<input type="date" name="hasta"></label>
  <div class="botones-estad"><button class="btn2" type="button" id="limpiar">Limpiar</button><button class="btn" type="submit" id="generar">Generar gráficas</button></div>
</form>
<div id="resultado" class="columna" style="gap:16px"></div>
<span class="tenue" style="font-size:13px">Las estadísticas se muestran agrupadas y nunca relacionan a una persona con su voto.</span>
</main>
<script src="/vendor/chartjs/chart.umd.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/pages/admin-estadisticas.js" defer></script>
</body>
</html>
