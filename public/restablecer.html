<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · Prepar</title>
  <link rel="icon" type="image/png" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <div class="barra"><a class="marca" href="/"><img src="/img/logo.png" alt="">Prepar</a></div>
  </header>
  <main class="centro">
    <a class="volver" href="/">← Volver al inicio</a>
    <div class="caja">
      <h1>Nueva contraseña</h1>
      <p class="tenue" style="margin:4px 0 20px">Escribe tu contraseña nueva dos veces.</p>
      <form method="post" id="form">
        <label>Contraseña nueva<input name="password" type="password" maxlength="64" required></label>
        <label>Repite la contraseña<input name="confirmar" type="password" maxlength="64" required></label>
        <p class="tenue" style="margin-top:-6px">De 8 a 64 caracteres, con al menos una mayúscula y un número. Solo letras, números y @ # $ % &amp;</p>
        <p class="mensaje"></p>
        <button class="btn grande" style="width:100%">Guardar contraseña</button>
      </form>
    </div>
  </main>
  <footer>
    <div><span>Prepar · Simulador educativo del Presupuesto Participativo de la CDMX · Equipo 04</span><a href="/privacidad.html">Aviso de privacidad</a></div>
  </footer>
  <script src="/js/app.js"></script>
  <script src="/js/pages/restablecer.js"></script>
</body>
</html>
