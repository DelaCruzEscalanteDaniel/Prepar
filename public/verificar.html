<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepar: simulador educativo del Presupuesto Participativo de la Ciudad de México.">
<meta name="theme-color" content="#F3F6FA">
<title>Confirmar correo · Prepar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=castor2">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=castor2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=castor2">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-rol="invitado" data-pagina="verificar" class="acceso-fondo">
<main id="principal" tabindex="-1">
<div class="acceso">
  <div class="barra-sup">
    <a class="volver" href="/">← Volver al inicio</a>
    <div class="acciones"></div>
  </div>
  <div class="centro-acceso">
    <div class="caja-vidrio angosta">
      <div class="cabeza-acceso">
        <img src="/img/logo.png?v=castor2" alt="Logo de Prepar" class="logo-acceso">
        <h1>Confirmar tu correo</h1>
        <p>Así comprobamos que el correo es tuyo y que una misma persona no crea varias cuentas para votar.</p>
      </div>
      <div id="mensaje-verificar" aria-live="polite"><div class="cargando-bloque">Confirmando tu correo…</div></div>
      <div class="fila" id="acciones-verificar" hidden><a class="btn grande" id="ir-verificar" href="/login.html">Iniciar sesión</a></div>
    </div>
  </div>
</div>
</main>
<script src="/js/app.js" defer></script>
<script src="/js/pages/verificar.js" defer></script>
</body>
</html>
