<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header><div class="barra"><a class="marca" href="/"><img src="/img/logo.png" alt="">Prepar</a></div></header>
<main class="centro">
<div class="caja">
<h1>Iniciar sesión</h1>
<p class="tenue">Simulador del Presupuesto Participativo de la CDMX</p>
<form method="post" id="form">
<label>Correo<input name="correo" type="email" autocomplete="username" required></label>
<label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
<p class="mensaje"></p>
<button class="btn" style="width:100%">Entrar</button>
</form>
<p class="tenue" style="text-align:center;margin:14px 0 0"><a href="/recuperar.html">¿Olvidaste tu contraseña?</a> · <a href="/registro.html">Crear cuenta</a></p>
</div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
