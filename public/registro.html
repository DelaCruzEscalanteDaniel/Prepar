<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header><div class="barra"><a class="marca" href="/"><img src="/img/logo.png" alt="">Prepar</a></div></header>
<main class="centro">
<div class="caja">
<h1>Crear cuenta</h1>
<p class="tenue">Para participar en el presupuesto de tu colonia</p>
<form method="post" id="form">
<label>Nombre completo<input name="nombre" maxlength="60" required></label>
<label>Correo<input name="correo" type="email" maxlength="60" required></label>
<label>Teléfono (opcional)<input name="telefono" inputmode="numeric" maxlength="10"></label>
<label>Alcaldía<select id="alcaldia" required></select></label>
<label>Colonia<select name="colonia_id" id="colonia" required></select></label>
<label>Contraseña<input name="password" type="password" maxlength="64" required></label>
<label>Repite la contraseña<input name="confirmar" type="password" maxlength="64" required></label>
<p class="tenue">De 8 a 64 caracteres, con al menos una mayúscula y un número. Solo letras, números y @ # $ % &amp;</p>
<label style="font-weight:400"><input type="checkbox" name="acepto"> Acepto el <a href="/privacidad.html" target="_blank">aviso de privacidad</a></label>
<p class="mensaje"></p>
<button class="btn" style="width:100%">Crear cuenta</button>
</form>
<p class="tenue" style="text-align:center;margin:14px 0 0">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
</div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/registro.js"></script>
</body>
</html>
