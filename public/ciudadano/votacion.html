<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votación · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<h1 id="titulo">Votación</h1>
<div class="aviso" id="aviso"></div>
<form method="post" class="caja oculto" id="form" style="max-width:720px">
<p class="tenue" style="margin-top:0">Elige un proyecto. Solo puedes votar una vez y tu voto es secreto.</p>
<div id="opciones"></div>
<p class="mensaje"></p>
<button class="btn">Votar</button>
</form>
<div class="caja oculto" id="comprobante" style="max-width:720px">
<h2>Comprobante de participación</h2>
<p>Ya votaste en este ciclo. Guarda tu folio:</p>
<div class="dato" id="folio"></div>
<p class="tenue" id="fecha-voto"></p>
<button class="btn2" id="imprimir">Imprimir comprobante</button>
</div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/ciudadano-votacion.js"></script>
</body>
</html>
