<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<h1>Mis proyectos</h1>
<div class="caja tabla"><table><thead><tr><th>Proyecto</th><th>Rubro</th><th>Costo</th><th>Estatus</th><th>Dictamen</th></tr></thead><tbody id="lista"></tbody></table></div>
<div class="aviso oculto" id="cerrado"></div>
<form method="post" class="caja" id="form">
<h2>Registrar un proyecto para tu colonia</h2>
<div class="fila">
<div>
<label>Título<input name="titulo" maxlength="100" required></label>
<label>Descripción<textarea name="descripcion" rows="4" maxlength="500" required></textarea></label>
<label>Rubro<select name="rubro_id" id="rubro" required></select></label>
<label>Costo estimado (pesos)<input name="costo" type="number" min="1" step="0.01" required></label>
<p class="tenue" id="tope" style="margin-top:-8px"></p>
</div>
<div>
<label>Calle<input name="calle" maxlength="100" required></label>
<label>Número (opcional)<input name="numero" maxlength="10"></label>
<p class="tenue" style="margin:0 0 6px">Toca el mapa para marcar dónde sería el proyecto.</p>
<div id="mapa" class="mapa-chico"></div>
<label>Foto (opcional, JPG o PNG)<input name="foto" type="file" accept="image/jpeg,image/png"></label>
</div>
</div>
<p class="mensaje"></p>
<button class="btn">Registrar proyecto</button>
</form>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/ciudadano-proyectos.js"></script>
</body>
</html>
