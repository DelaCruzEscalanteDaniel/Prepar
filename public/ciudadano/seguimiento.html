<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepar: simulador educativo del Presupuesto Participativo de la Ciudad de México.">
<meta name="theme-color" content="#F3F6FA">
<title>Foto denuncia · Prepar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=castor2">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=castor2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=castor2">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-rol="ciudadano" data-pagina="seguimiento">
<main id="principal" class="contenido" tabindex="-1">
<section id="vista-lista" class="columna" style="gap:18px">
  <div>
    <h1 class="titulo-pagina" id="titulo-obras" style="font-size:32px">Obras ganadoras</h1>
    <p class="texto-2" style="margin:0">Elige una obra para ver cómo va, calificarla y subir fotos de su avance o de algo que no esté bien.</p>
  </div>
  <div id="obras" class="obras-grid" aria-live="polite"></div>
</section>

<section id="vista-obra" class="columna" style="gap:18px" hidden>
  <a href="#" id="volver-obras" class="volver-enlace" style="align-self:flex-start">← Volver a las obras</a>
  <div class="fila entre" style="gap:16px;align-items:flex-end">
    <div class="columna" style="gap:6px;min-width:0">
      <span id="obra-rubro"></span>
      <h1 class="titulo-pagina" id="obra-titulo" style="font-size:32px;margin:0"></h1>
      <span class="texto-2" id="obra-lugar"></span>
    </div>
    <button type="button" class="btn" id="abrir-foto">📷 Subir foto de esta obra</button>
  </div>
  <div class="fila arriba" style="gap:20px">
    <div class="columna" style="flex:1 1 320px;min-width:0;gap:16px">
      <section class="tarjeta columna" style="gap:12px" aria-labelledby="t-avance">
        <div class="fila entre"><h2 id="t-avance" class="h2-maq" style="margin:0;font-size:18px">Avance de la obra</h2><strong id="obra-pct" class="monto-avance" style="margin:0"></strong></div>
        <span class="barra-obra grande"><span id="obra-barra"></span></span>
        <ol class="pasos-ciudadano" id="obra-pasos"></ol>
      </section>
      <section class="tarjeta columna" style="gap:10px" aria-labelledby="t-calif">
        <h2 id="t-calif" class="h2-maq" style="margin:0;font-size:18px">Califica esta obra</h2>
        <div id="obra-estrellas"></div>
        <span class="tenue pequeno" id="obra-calif-nota"></span>
      </section>
    </div>
    <section class="columna" style="flex:2 1 440px;min-width:0;gap:14px" aria-labelledby="t-reportes">
      <h2 id="t-reportes" class="h2-maq" style="margin:0;font-size:20px">Reportes de vecinos</h2>
      <div id="reportes" class="columna" style="gap:14px" aria-live="polite"></div>
      <div class="fila" style="justify-content:center"><button class="btn2" id="mas-rep" hidden>Ver más reportes</button></div>
    </section>
  </div>
</section>

<div class="modal-fondo" id="ventana-foto" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="t-subir">
    <div class="fila entre"><h2 id="t-subir" style="margin:0">Subir foto</h2><button type="button" class="herr cerrar" id="cerrar-foto" aria-label="Cerrar">✕</button></div>
    <form class="columna" id="form-rep" style="gap:14px" novalidate>
      <span class="texto-2" id="rep-obra"></span>
      <fieldset class="sin-marco"><legend class="solo-lector">Tipo de reporte</legend>
        <div class="tipo-rep">
          <label><input type="radio" name="tipo" value="avance" checked><span>✓ Va bien (avance)</span></label>
          <label><input type="radio" name="tipo" value="irregularidad"><span>⚠ Algo está mal</span></label>
        </div></fieldset>
      <div class="columna" style="gap:6px">
        <label class="zona-fotos" id="zona-fotos"><input type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple id="fotos-rep" class="solo-lector">
          <span class="zona-icono" aria-hidden="true">📷</span><strong id="texto-zona">Toca aquí para elegir fotos</strong>
          <span class="ayuda" id="cuenta-fotos">de 1 a 5 fotos (JPG o PNG)</span></label>
        <div class="previas" id="previas-rep"></div>
        <div id="rechazos-rep" aria-live="polite"></div>
      </div>
      <label>¿Qué se ve en la foto?<textarea name="descripcion" rows="3" maxlength="500" required placeholder="Ej.: ya pusieron las bancas"></textarea></label>
      <div id="msg-rep"></div>
      <button type="submit" class="btn" id="publicar-rep">Publicar</button>
    </form>
  </div>
</div>
</main>
<script src="/js/app.js" defer></script>
<script src="/js/pages/ciudadano-seguimiento.js" defer></script>
</body>
</html>
