<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto denuncia · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<section id="vista-lista">
<h1>Foto denuncia</h1>
<p class="tenue">Elige una obra de tu alcaldía para ver sus fotos o subir una.</p>
<div class="caja tabla"><table><thead><tr><th>Obra</th><th>Colonia</th><th style="width:200px">Avance</th><th>Fotos</th><th></th></tr></thead><tbody id="obras"></tbody></table></div>
</section>
<section id="vista-obra" class="oculto">
<p style="margin:0"><a href="#">← Volver a las obras</a></p>
<h1 id="obra-titulo"></h1>
<p class="tenue" id="obra-datos" style="margin:0 0 16px"></p>
<div class="fila">
<div class="caja" style="flex:1.4"><h2>Fotos de los vecinos</h2><div id="obra-fotos"></div></div>
<div>
<form method="post" class="caja" id="form" style="margin-bottom:18px">
<h2>Subir foto</h2>
<label>Foto (JPG o PNG)<input name="foto" type="file" accept="image/jpeg,image/png" required></label>
<label>Comentario<textarea name="comentario" rows="3" maxlength="250" placeholder="¿Qué se ve en la foto?" required></textarea></label>
<p class="mensaje"></p>
<button class="btn">Publicar</button>
</form>
<div class="caja"><h2>Pasos de la obra</h2><table id="obra-pasos"></table></div>
</div>
</div>
</section>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/ciudadano-fotos.js"></script>
</body>
</html>
