<body data-rol="funcionario" data-pagina="sorteo">
<main id="principal" tabindex="-1">
<div><span class="chip-sup">Se usa en la fase 4 (sorteo) y después del conteo (casos especiales)</span><h1 class="titulo-pagina" style="margin:10px 0 4px;font-size:32px">Sorteo y casos especiales</h1>
  <p class="texto-2" style="margin:0">Asigna al azar el número de cada proyecto en la boleta y resuelve las colonias donde no hubo un ganador claro.</p></div>
<div class="fila pestanas-maq" role="tablist">
  <button type="button" role="tab" class="tab-maq" data-pestana="sorteo" aria-selected="true">Sorteo de números (<span data-n="sorteo">0</span>)</button>
  <button type="button" role="tab" class="tab-maq" data-pestana="casos" aria-selected="false">Casos especiales (<span data-n="casos">0</span>)</button>

  <div class="fila arriba" style="gap:18px">

    <section class="tarjeta columna panel-dict" id="panel-sorteo" style="gap:14px"></section>
  </div>
</section>
<section data-panel="casos" class="columna" style="gap:14px" hidden>

  <div class="fila arriba" style="gap:18px">
    <section class="columna" style="flex:1 1 240px;min-width:0;gap:10px" id="lista-casos" aria-label="Casos especiales"></section>
    <section class="tarjeta columna panel-dict" id="panel-caso" style="gap:14px"></section>
  </div>
</section>
</main>
