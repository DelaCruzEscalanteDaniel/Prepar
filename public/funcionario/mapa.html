<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepar: simulador educativo del Presupuesto Participativo de la Ciudad de México.">
<meta name="theme-color" content="#F3F6FA">
<title>Mapa y ubicaciones · Prepar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-rol="funcionario" data-pagina="mapa">
<main id="principal" tabindex="-1">
<div><h1 class="titulo-pagina" style="font-size:32px">Mapa y ubicaciones</h1>
  <p class="texto-2" style="margin:0"><strong class="acento-texto">1.</strong> Elige un proyecto · <strong class="acento-texto">2.</strong> Corrige su dirección o toca el mapa para moverlo · <strong class="acento-texto">3.</strong> Guarda los cambios</p></div>
<div class="fila arriba" style="gap:18px">
  <section class="columna" style="flex:1 1 280px;min-width:0;gap:10px" id="lista-ub" aria-label="Proyectos de tu alcaldía"></section>
  <section class="columna" style="flex:2 1 460px;min-width:0;gap:12px">
    <div class="fila" style="gap:8px">
      <button type="button" class="btn" id="modo-mover" aria-pressed="false">Cambiar ubicación en el mapa</button>
      <button type="button" class="btn2" id="ocultar-mapa">Ocultar del mapa público</button>
      <span class="tenue" style="font-size:13px;font-weight:600" id="pista-ub"></span>
    </div>
    <div id="mapa-func" class="mapa mapa-func"></div>
    <form id="form-ub" class="tarjeta form-ub" novalidate>
      <label>Calle <span class="opcional">(hasta 100)</span><input type="text" name="calle" maxlength="100" required></label>
      <label>Número <span class="opcional">(hasta 10)</span><input type="text" name="numero" maxlength="10"></label>
      <label class="completo">Referencias <span class="opcional">(hasta 100)</span><input type="text" name="referencias" maxlength="100"></label>
      <div class="completo fila" style="gap:10px"><button type="submit" class="btn" id="guardar-ub">Guardar cambios</button><button type="button" class="btn2" id="deshacer-ub">Deshacer</button><span id="msg-ub" aria-live="polite"></span></div>
    </form>
  </section>
</div>
</main>
<script src="/vendor/leaflet/leaflet.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/pages/funcionario-mapa.js" defer></script>
</body>
</html>
