<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepar: simulador educativo del Presupuesto Participativo de la Ciudad de México.">
<meta name="theme-color" content="#F3F6FA">
<title>Seguimiento de obras · Prepar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-rol="funcionario" data-pagina="seguimiento">
<main id="principal" tabindex="-1">
<div><span class="chip-sup">Se usa en la fase 7 · Ejecución y seguimiento</span><h1 class="titulo-pagina" style="margin:10px 0 4px;font-size:32px">Seguimiento de obras</h1>
  <p class="texto-2" style="margin:0">Actualiza cómo van las obras ganadoras y responde a los reportes de los vecinos.</p></div>
<div class="fila pestanas-maq" role="tablist">
  <button type="button" role="tab" class="tab-maq" data-pestana="avance" aria-selected="true">Registrar avance</button>
  <button type="button" role="tab" class="tab-maq" data-pestana="reportes" aria-selected="false">Reportes de vecinos (<span data-n="reportes">0</span>)</button>
</div>
<div id="estado-seg"></div>
<section data-panel="avance" class="fila arriba" style="gap:18px">
  <section class="columna" style="flex:1 1 260px;min-width:0;gap:10px" id="obras" aria-label="Obras"></section>
  <section class="tarjeta columna panel-dict" id="panel-avance"></section>
</section>
<section data-panel="reportes" class="columna" style="gap:12px" hidden>
  <div class="fila" style="gap:8px"><label class="fila pequeno">Mostrar<select id="f-rep"><option value="pendiente">Pendientes</option><option value="atendido">Atendidos</option><option value="">Todos</option></select></label></div>
  <div id="reportes" class="columna" style="gap:12px"></div>
</section>
</main>
<script src="/js/app.js" defer></script>
<script src="/js/pages/funcionario-seguimiento.js" defer></script>
</body>
</html>
