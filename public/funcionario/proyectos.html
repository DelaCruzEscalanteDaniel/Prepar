<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos · Prepar</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header></header>
<main>
<h1>Proyectos de la alcaldía</h1>
<p class="tenue" id="ayuda" style="margin:-10px 0 0"></p>
<div class="caja tabla"><table><thead><tr><th>Proyecto</th><th>Colonia</th><th>Costo</th><th>Estatus</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
<form method="post" class="caja oculto" id="form">
<h2 id="form-titulo">Dictamen</h2>
<p id="form-detalle"></p>
<label class="opcion"><input type="radio" name="resultado" value="viable" required> Viable</label>
<label class="opcion"><input type="radio" name="resultado" value="no_viable"> No viable</label>
<label>Justificación<textarea name="justificacion" rows="3" maxlength="500" required></textarea></label>
<p class="mensaje"></p>
<button class="btn">Guardar dictamen</button> <button type="button" class="btn2" id="cancelar">Cancelar</button>
</form>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/funcionario-proyectos.js"></script>
</body>
</html>
